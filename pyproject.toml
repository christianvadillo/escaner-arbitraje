[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "escaner-arbitraje"
version = "0.1.0"
description = "Escáner de arbitraje entre retailers mexicanos y Mercado Libre: empareja productos y calcula margen neto con comisiones, envío e impuestos reales."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propietario" }
authors = [{ name = "Christian Vadillo" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["anthropic>=1.7,<2"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1.7,<2"]

[project.scripts]
escaner = "escaner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/escaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
